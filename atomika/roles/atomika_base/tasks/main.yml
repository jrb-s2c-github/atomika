 - name: Update and upgrade apt packages
   become: true
   apt:
     upgrade: yes
     update_cache: yes
     cache_valid_time: 86400 #One day

 - name: Make the Swap inactive
   command: swapoff -a

 - name: Remove Swap entry from /etc/fstab.
   lineinfile:
     dest: /etc/fstab
     regexp: swap
     state: absent

 - name: Create an empty file for containerd module.
   copy:
     content: ""
     dest: /etc/modules-load.d/k8s.conf
     force: no

       # dest: /etc/modules-load.d/containerd.conf
 - name: Configure module for containerd.
   blockinfile:
     path: /etc/modules-load.d/k8s.conf
     block: |
          overlay
          br_netfilter

 - name: Create an empty file for kubernetes sysctl params.
   copy:
     content: ""
     dest: /etc/sysctl.d/99-kubernetes-cri.conf
     force: no

 - name: Configure sysctl params for Kubernetes.
   lineinfile:
     path: /etc/sysctl.d/99-kubernetes-cri.conf
     line: "{{ item }}"
   with_items:
     - 'net.bridge.bridge-nf-call-iptables  = 1'
     - 'net.ipv4.ip_forward                 = 1'
     - 'net.bridge.bridge-nf-call-ip6tables = 1'

 - name: Apply sysctl params without reboot.
   command: sysctl --system

 - name: Stop systemd modules
   ansible.builtin.systemd_service:
    name: systemd-modules-load.service
    state: stopped

 - name: Start systemd modules
   ansible.builtin.systemd_service:
    name: systemd-modules-load.service
    state: started

 - name: Installing Prerequisites for Kubernetes
   apt:
     name:
       - apt-transport-https
       - ca-certificates
       - curl
       - gnupg-agent
       - vim
       - software-properties-common
     state: present

 - name: Add Docker’s official GPG key
   ansible.builtin.get_url:
     url: https://download.docker.com/linux/ubuntu/gpg
     dest: /etc/apt/keyrings/docker.asc
     mode: "0644"

 - name: Add Docker Repository
   become: true
   apt_repository:
     repo: >-
          deb [arch=amd64
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
     #repo: deb [arch=amd64  signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable
     #repo: deb [arch=armhf] https://download.docker.com/linux/ubuntu xenial stable
     state: present
     filename: docker
     update_cache: yes

 - name: Install containerd
   #block:
   #- name: Install containerd not allowing downgrade
   apt:
     name:
           #- containerd.io={{ containerd_version }}
       - containerd.io
     state: present
           #rescue:
           #- name: Retry to install containerd allowing downgrade
           #apt:
           #allow_downgrade: true
           #name:
           #- containerd.io={{ containerd_version }}
           #state: present
  #
# - name: Install containerd.
#   apt:
#     name:
#       - containerd
#     state: present

 - name: Configure containerd - create dir.
   file:
     path: /etc/containerd
     state: directory

 - name: Configure containerd - create toml.
   shell: /usr/bin/containerd config default > /etc/containerd/config.toml

     #- name: Configuring containerd to use version 3.9 of pause container
     #ansible.builtin.replace:
     #path: /etc/containerd/config.toml
     #regexp: pause:3.6
     #replace: pause:3.9     
  
 - name: Configuring containerd to enable SystemdCgroup
   ansible.builtin.replace:
     path: /etc/containerd/config.toml
     regexp: SystemdCgroup = false
     replace: SystemdCgroup = true 

 - name: Enable containerd service, and start it.
   systemd:
     name: containerd
     state: restarted
     enabled: yes
     daemon-reload: yes

 - name: Create apt keyring directory
   ansible.builtin.file:
     path: /etc/apt/keyrings
     state: directory
     mode: '0755'

 - name: Add kubernetes GPG key
   apt_key:
     #url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
     url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
     keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
     state: present

 - name: Add Kubernetes Repository
   become: true
   apt_repository:
     repo: deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /
    #repo: deb http://apt.kubernetes.io/ kubernetes-xenial main
     state: present
     filename: kubernetes
     mode: 0600

 - name: Installing Kubernetes Cluster Packages.
   become: true
   apt:
     name:
       - kubeadm
       - kubectl
       - kubelet
     state: present
     update_cache: true

 - name: Enable service kubelet, and enable persistently
   service:
     name: kubelet
     enabled: yes

