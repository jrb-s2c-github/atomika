# k8s_join_nodes.yml
---

- hosts: masters
  gather_facts: false
  tasks:
    - name: Determine join command
      block:
        - name: Get the token for joining the nodes with Kubernetes master.
          become: true
          shell: kubeadm --kubeconfig /etc/kubernetes/admin.conf token create  --print-join-command
          register: kubernetes_join_command

    #   - debug:
    #       msg: "{{ kubernetes_join_command.stdout }}"

        - name: Generate the secret for joining the nodes with Kubernetes master.
          run_once: true
          become: yes
          shell: kubeadm --kubeconfig /etc/kubernetes/admin.conf init phase upload-certs --upload-certs
          register: kubernetes_join_secret

        - name: Copy join command for comaster to local file.
          run_once: true
          become: false
          local_action: copy content="{{ kubernetes_join_command.stdout_lines[0] }} --control-plane --certificate-key {{ kubernetes_join_secret.stdout_lines[2] }}" dest="/tmp/kubernetes_cm_join_command" mode=0700

        - name: Copy join command for worker to local file.
          become: false
          local_action: copy content="{{ kubernetes_join_command.stdout_lines[0] }} --certificate-key {{ kubernetes_join_secret.stdout_lines[2] }}" dest="/tmp/kubernetes_worker_join_command" mode=0700
      when: groups['comasters'] is defined or groups['workers'] is defined

- hosts: comasters, workers
  become: yes
  become_method: sudo
  become_user: root
  gather_facts: yes
  connection: ssh

  tasks:

   - name: Copy join command to comasters.
     become: yes
     become_method: sudo
     become_user: root
     copy:
       src: /tmp/kubernetes_cm_join_command
       dest: /tmp/kubernetes_join_command
       mode: 0700
     when: "'comasters' in groups and ansible_hostname in groups['comasters']"

   - name: Copy join command to workers
     become: yes
     become_method: sudo
     become_user: root
     copy:
       src: /tmp/kubernetes_worker_join_command
       dest: /tmp/kubernetes_join_command
       mode: 0700
     when: "'workers' in groups and ansible_hostname in groups['workers']"

   - name: Join the nodes with the master.
     become: yes
     become_method: sudo
     become_user: root
     command: sh /tmp/kubernetes_join_command
     register: joined_or_not

   - debug:
       msg: "{{ joined_or_not.stdout }}"

...

