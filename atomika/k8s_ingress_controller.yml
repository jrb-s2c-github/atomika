#      run_once: true

    - name: FIXME
      become_user: "{{ ansible_user }}"
      become_method: sudo
      command: kubectl delete -A ValidatingWebhookConfiguration ingress-nginx-admission
      run_once: true

#    - name: Wait till all pods are running
#      kubernetes.core.k8s_info:
