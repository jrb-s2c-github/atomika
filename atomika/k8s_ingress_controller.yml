# k8s_ingress_controller.yml

- hosts: masters
  connection: ssh
  vars_prompt:
    - name: "metal_lb_range"
      prompt: "Enter the IP range from which the load balancer IP can be assigned?"
      private: no
      default: 192.168.68.200-192.168.68.210
  tasks:
    - name: Download ingress-nginx manifest to the cluster.
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
        dest: ~/ingress-nginx.yaml
        mode: '0664'

    - name: Apply ingress-nginx manifest to the cluster.
      kubernetes.core.k8s:
        state: present
        src: ~/ingress-nginx.yaml
