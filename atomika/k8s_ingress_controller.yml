    - name: Download metallb manifest to the cluster.
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
        dest: ~/metallb.yaml
        mode: '0664'

    - name: Apply metallb manifest to the cluster.
      kubernetes.core.k8s:
        state: present
        src: ~/metallb.yaml
#
#    - name: Install Metallb2.
#      become_user: "{{ ansible_user }}"
#      become_method: sudo
#      become: yes
#      command: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml

    - name: Wait till all pods are running
      kubernetes.core.k8s_info:
        kind: Pod
        wait: yes
        namespace: metallb-system
        wait_sleep: 3
        wait_timeout: 30
        wait_condition:
          type: Ready

    - name: Prepare L2Advertisement.
      become_user: "{{ ansible_user }}"
      become_method: sudo
      copy:
        dest: "~/l2advertisement.yml"
        content: |
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: example
            namespace: metallb-system

    - name: Prepare address pool.
      become_user: "{{ ansible_user }}"
      become_method: sudo
      copy:
        dest: "~/address-pool.yml"
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: first-pool
            namespace: metallb-system
          spec:
            addresses:
            - {{ metal_lb_range }}


