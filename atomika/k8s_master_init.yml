# k8s_master_init.yml

- hosts: masters
#  become: yes
#  become_method: sudo
#  become_user: root
  connection: ssh
  vars_prompt:
    # TODO rename to secondary_kubectl_user and perhaps reword prompt?
#    - name: kubectl_user_temp
#      prompt: "Enter the name of the existing user that will execute kubectl commands or press enter when machine only has the bootstrapped ansible account."
#      private: no
#      default:

  tasks:
   - name: Initializing Kubernetes Cluster
     become: yes
     command: kubeadm init --pod-network-cidr=10.244.0.0/16 --control-plane-endpoint=k8scp:6443 --upload-certs
     run_once: true

   - name: Download flannel manifest.
     ansible.builtin.get_url:
       url: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
       dest: ~/kube-flannel.yaml
       mode: '0664'

   - name: Apply flannel manifest to create overlay network.
     become: true
     kubernetes.core.k8s:
       kubeconfig: /etc/kubernetes/admin.conf
       state: present
       src: ~{{ ansible_user }}/kube-flannel.yaml
     register: pod_list

