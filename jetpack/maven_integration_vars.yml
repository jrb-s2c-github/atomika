# Example of how to configure Jetpack to deploy images integrated using Maven JIB. See README.MD in root for explanation

git_server_fqdn: github.com

apps:
  - name: hello1
    git_account: jrb-s2c-github
    git_repo: spinnaker_tryout
    integration_dir: hello_svc
    namespace: env1
    git_branch: kustomize
    replicas: 3
    application_properties:
      application.properties: |
        my_name: LocalKubeletEnv1
  - name: hello2
    git_account: jrb-s2c-github
    git_repo: spinnaker_tryout
    integration_dir: hello_svc
    namespace: env2
    config_map_path:
    git_branch: kustomize
    application_properties:
      application.properties: |
        my_name: LocalKubeletEnv2
ingress:
  host: www.demo.io
  rules:
    - service: hello1
      namespace: env1
      ingress_path: /env1/hello
      service_path: /
    - service: hello2
      namespace: env2
      ingress_path: /env2/hello
      service_path: /

namespaces:
  - name: env1
  - name: env2

mvn_parents:
  - name: hello1/hello_svc

pre_k8s_cmds:
  - kubectl get nodes

post_k8s_cmds:
  - kubectl get pods -A

