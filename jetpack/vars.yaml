apps:
  - name: hello1
    git_repo: spinnaker_tryout
    jib_dir: hello_svc
    image: s2c/hello_svc
    namespace: env1
    git_branch: kustomize
    replicas: 3
    application_properties:
      application.properties: |
        my_name: LocalKubeletEnv1
  - name: hello2
    git_repo: spinnaker_tryout
    jib_dir: hello_svc
    image: s2c/hello_svc
    namespace: env2
    config_map_path:
    git_branch: kustomize
    application_properties:
      application.properties: |
        my_name: LocalKubeletEnv2
ingress:
  host: www.demo.io
  rules:
    - service: hello1
      namespace: env1
      ingress_path: /env1/hello
      service_path: /
    - service: hello2
      namespace: env2
      ingress_path: /env2/hello
      service_path: /

namespaces:
  - name: env1
  - name: env2

mvn_parents:
  - name: hello1/hello_svc

pre_k8s_cmds:
  - kubectl create ns temp

post_k8s_cmds:
  - kubectl delete ns temp
